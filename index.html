<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code++</title>

    <meta
        name="description"
        content="Code++ - trình soạn thảo lập trình hiện đại."
    >

    <link rel="icon" type="image/x-icon" href="icon.ico">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070a10;
            --bg2: #0c111b;
            --card: rgba(18, 24, 38, .72);
            --border: rgba(255,255,255,.09);
            --text: #f5f7ff;
            --muted: #8f99ad;
            --blue: #7187ff;
            --blue2: #9baaff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            overflow-x: hidden;
        }

        button,
        a {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            pointer-events: none;
        }

        .orb {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: .18;

            animation:
                floatOrb 12s ease-in-out infinite;
        }

        .orb.one {
            background: #506cff;

            top: -220px;
            left: -180px;
        }

        .orb.two {
            background: #8a4dff;

            right: -220px;
            top: 30%;

            animation-delay: -4s;
        }

        .orb.three {
            background: #326cff;

            bottom: -300px;
            left: 35%;

            animation-delay: -8s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(50px,-35px,0)
                    scale(1.1);
            }
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 72px;

            z-index: 1000;

            background:
                rgba(7,10,16,.72);

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .header-inner {
            width:
                min(
                    1160px,
                    calc(100% - 36px)
                );

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            border: 0;

            background: none;

            color: white;

            font-size: 21px;

            font-weight: 800;
        }

        .logo img {
            width: 39px;
            height: 39px;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 0 25px
                rgba(113,135,255,.22);
        }

        .nav {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .nav button {
            border: 0;

            background: transparent;

            color: #a9b2c5;

            padding:
                9px
                12px;

            border-radius: 9px;

            transition: .2s;
        }

        .nav button:hover {
            color: white;

            background:
                rgba(255,255,255,.06);
        }

        .nav .nav-download {
            background: white;

            color: #111521;

            font-weight: 700;

            margin-left: 7px;
        }

        .nav .nav-download:hover {
            background: #e9ecff;

            color: #111521;
        }

        /* =========================
           APP
        ========================= */

        #app {
            padding-top: 72px;

            min-height: 100vh;
        }

        .page {
            min-height:
                calc(100vh - 72px);

            padding:
                90px 20px;

            animation:
                pageIn .45s ease;
        }

        @keyframes pageIn {
            from {
                opacity: 0;

                transform:
                    translateY(14px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .page-inner {
            width:
                min(
                    1120px,
                    100%
                );

            margin: auto;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            position: relative;
        }

        .hero-content {
            max-width: 900px;
        }

        .badge {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                8px
                14px;

            border:
                1px solid
                rgba(255,255,255,.1);

            background:
                rgba(255,255,255,.045);

            border-radius: 999px;

            color: #aeb7ca;

            font-size: 13px;

            animation:
                fadeUp .7s ease;
        }

        .badge::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #7f91ff;

            box-shadow:
                0 0 12px
                #7f91ff;
        }

        .hero h1 {
            margin-top: 28px;

            font-size:
                clamp(
                    70px,
                    12vw,
                    125px
                );

            line-height: .86;

            letter-spacing: -8px;

            animation:
                fadeUp .8s ease;
        }

        .hero h1 span {
            color: var(--blue2);

            text-shadow:
                0 0 45px
                rgba(113,135,255,.32);
        }

        .hero p {
            max-width: 680px;

            margin:
                30px
                auto
                0;

            color: #9da7ba;

            font-size: 18px;

            animation:
                fadeUp .9s ease;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 34px;

            animation:
                fadeUp 1s ease;
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 49px;

            padding:
                0
                22px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255,255,255,.1);

            font-weight: 700;

            transition:
                transform .2s,
                box-shadow .2s,
                background .2s;
        }

        .btn:hover {
            transform:
                translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.25);
        }

        .btn-primary {
            background: white;

            color: #101522;
        }

        .btn-primary:hover {
            background: #edf0ff;
        }

        .btn-secondary {
            background:
                rgba(255,255,255,.055);

            color: white;
        }

        .version-text {
            margin-top: 17px;

            color: #677185;

            font-size: 13px;

            animation:
                fadeUp 1.1s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* =========================
           TITLES
        ========================= */

        .page-title {
            text-align: center;

            margin-bottom: 55px;
        }

        .page-title h1 {
            font-size:
                clamp(
                    38px,
                    6vw,
                    55px
                );

            letter-spacing: -2px;

            margin-bottom: 12px;
        }

        .page-title p {
            color: var(--muted);
        }

        /* =========================
           BACK
        ========================= */

        .back {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            border: 0;

            background: none;

            color: #98a2b6;

            font-size: 14px;

            margin-bottom: 32px;

            transition: .2s;
        }

        .back:hover {
            color: white;

            transform:
                translateX(-3px);
        }

        /* =========================
           CARDS
        ========================= */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 18px;
        }

        .card {
            padding: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,24,38,.82),
                    rgba(13,18,29,.62)
                );

            border:
                1px solid
                var(--border);

            border-radius: 17px;

            backdrop-filter:
                blur(12px);

            transition:
                transform .25s,
                border .25s,
                box-shadow .25s;
        }

        .card:hover {
            transform:
                translateY(-6px);

            border-color:
                rgba(135,150,255,.28);

            box-shadow:
                0 20px 45px
                rgba(0,0,0,.22);
        }

        .card-icon {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(113,135,255,.12);

            border:
                1px solid
                rgba(113,135,255,.15);

            border-radius: 12px;

            color: #a9b6ff;

            margin-bottom: 19px;

            font-weight: 700;
        }

        .card h3 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .card p {
            color: #8e98ad;

            font-size: 14px;
        }

        /* =========================
           DOWNLOAD
        ========================= */

        .edition {
            margin-bottom: 48px;
        }

        .edition-title {
            font-size: 28px;

            margin-bottom: 18px;
        }

        .download-card {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 24px;

            margin-bottom: 12px;

            background:
                rgba(17,23,37,.72);

            border:
                1px solid
                var(--border);

            border-radius: 15px;

            transition: .25s;
        }

        .download-card:hover {
            border-color:
                rgba(135,150,255,.25);

            transform:
                translateX(3px);
        }

        .download-info h3 {
            margin-bottom: 6px;
        }

        .download-info p {
            color: #8993a8;

            font-size: 13px;
        }

        .latest {
            display: inline-block;

            margin-left: 7px;

            padding:
                3px
                7px;

            border-radius: 5px;

            background:
                rgba(113,135,255,.12);

            color: #9aa9ff;

            font-size: 10px;
        }

        /* =========================
           RELEASE
        ========================= */

        .release-box {
            max-width: 820px;

            margin: auto;

            padding: 30px;

            background:
                rgba(17,23,37,.72);

            border:
                1px solid
                var(--border);

            border-radius: 17px;
        }

        .release {
            padding:
                24px
                0;

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .release:first-child {
            padding-top: 0;
        }

        .release:last-child {
            border-bottom: 0;

            padding-bottom: 0;
        }

        .release-head {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 12px;
        }

        .release-head h2 {
            font-size: 20px;
        }

        .release-tag {
            color: #8d9aff;

            font-size: 12px;
        }

        .release ul {
            padding-left: 20px;

            color: #919bb0;

            line-height: 1.8;
        }

        /* =========================
           DOC
        ========================= */

        .docs-text {
            max-width: 800px;

            margin: auto;

            color: #a0a9bb;

            line-height: 1.9;

            text-align: center;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding:
                35px
                20px;

            border-top:
                1px solid
                rgba(255,255,255,.07);

            color: #697388;

            text-align: center;

            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .nav button:not(.nav-download) {
                display: none;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .download-card {
                flex-direction: column;

                align-items: flex-start;
            }

            .hero h1 {
                letter-spacing: -4px;
            }

            .page {
                padding:
                    65px
                    18px;
            }
        }
    </style>
</head>

                                </span>

                            </div>

                            <ul>

                                <li>
                                    Phát hành dưới dạng ZIP.
                                </li>

                            </ul>

                        </div>


                    </div>

                </div>

            </section>

        `
    };


    /*
    ==================================================
       ROUTER
    ==================================================
    */

    let currentPage = "home";


    function render(page, push = true) {

        if (!pages[page]) {
            page = "home";
        }


        currentPage = page;


        const app =
            document.getElementById("app");


        app.innerHTML =
            pages[page];


        if (page === "download") {

            const java =
                document.getElementById(
                    "javaDownload"
                );


            if (java) {

                java.href =
                    JAVA_DOWNLOAD;

            }

        }


        if (push) {

            history.pushState(
                {
                    page: page
                },
                "",
                "#" + page
            );

        }


        updateTitle(page);


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function navigate(page) {

        render(
            page,
            true
        );

    }


    function goBack() {

        if (
            currentPage !== "home" &&
            history.length > 1
        ) {

            history.back();

        } else {

            navigate("home");

        }

    }


    function updateTitle(page) {

        const titles = {

            home:
                "Code++",

            download:
                "Tải xuống | Code++",

            features:
                "Tính năng | Code++",

            docs:
                "Tài liệu | Code++",

            changelog:
                "Changelog | Code++"

        };


        document.title =
            titles[page] ||
            "Code++";

    }


    /*
    ==================================================
       BROWSER BACK / FORWARD
    ==================================================
    */

    window.addEventListener(
        "popstate",
        function(event) {

            const page =
                event.state &&
                event.state.page
                    ? event.state.page
                    : (
                        location.hash
                            ? location.hash.substring(1)
                            : "home"
                    );


            render(
                page,
                false
            );

        }
    );


    /*
    ==================================================
       INITIAL LOAD
    ==================================================
    */

    let initialPage =
        location.hash
            ? location.hash.substring(1)
            : "home";


    if (!pages[initialPage]) {
        initialPage = "home";
    }


    render(
        initialPage,
        false
    );

</script>

</body>
</html>
