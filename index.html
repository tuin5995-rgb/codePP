<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code++</title>

    <meta
        name="description"
        content="Code++ - trình soạn thảo lập trình hiện đại."
    >

    <link rel="icon" href="icon.ico" type="image/x-icon">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #080b12;
            color: #f5f7fb;

            min-height: 100vh;
        }

        button,
        a {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 70px;

            z-index: 9999;

            background:
                rgba(8, 11, 18, 0.88);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }

        .header-inner {
            width:
                min(
                    1150px,
                    calc(100% - 40px)
                );

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 22px;

            font-weight: 800;
        }

        .logo img {
            width: 38px;
            height: 38px;

            object-fit: contain;

            border-radius: 9px;
        }

        .nav {
            display: flex;

            align-items: center;

            gap: 22px;
        }

        .nav button {
            border: none;

            background: none;

            color: #aeb7c9;

            font-size: 14px;
        }

        .nav button:hover {
            color: white;
        }

        .download-nav {
            padding:
                9px
                15px;

            background: white;

            color: #101522 !important;

            border-radius: 9px;

            font-weight: 700;
        }

        /* =========================
           APP
        ========================= */

        #app {
            min-height: 100vh;

            padding-top: 70px;
        }

        .page {
            min-height:
                calc(
                    100vh - 70px
                );

            padding:
                90px 20px;
        }

        .page-inner {
            width:
                min(
                    1100px,
                    100%
                );

            margin: auto;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(83,111,255,0.18),
                    transparent 38%
                );
        }

        .hero-content {
            max-width: 850px;
        }

        .badge {
            display: inline-block;

            padding:
                7px
                14px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 999px;

            color: #aeb7c9;

            background:
                rgba(255,255,255,0.04);

            font-size: 13px;

            margin-bottom: 25px;
        }

        .hero h1 {
            font-size:
                clamp(
                    60px,
                    11vw,
                    110px
                );

            line-height: 0.9;

            letter-spacing: -6px;

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #8ea2ff;
        }

        .hero p {
            max-width: 680px;

            margin: auto;

            color: #aab3c6;

            font-size: 18px;
        }

        .buttons {
            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            padding:
                0
                21px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            font-weight: 700;

            transition:
                transform .2s,
                background .2s;
        }

        .btn:hover {
            transform:
                translateY(-2px);
        }

        .btn-primary {
            background: white;

            color: #101522;
        }

        .btn-secondary {
            background:
                rgba(255,255,255,0.05);

            color: white;
        }

        .version-text {
            margin-top: 16px;

            color: #687286;

            font-size: 13px;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;

            margin-bottom: 55px;
        }

        .page-title h1 {
            font-size: 46px;

            margin-bottom: 12px;
        }

        .page-title p {
            color: #929caf;
        }

        /* =========================
           CARDS
        ========================= */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 18px;
        }

        .card {
            padding: 28px;

            background: #111725;

            border:
                1px solid
                rgba(255,255,255,0.07);

            border-radius: 16px;
        }

        .card h2,
        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #929caf;

            font-size: 14px;
        }

        .icon {
            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 18px;

            background: #1b2335;

            border-radius: 11px;

            font-size: 19px;
        }

        /* =========================
           DOWNLOAD
        ========================= */

        .edition {
            margin-bottom: 45px;
        }

        .edition-title {
            margin-bottom: 18px;

            font-size: 28px;
        }

        .download-card {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 24px;

            background: #111725;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 15px;

            margin-bottom: 12px;
        }

        .download-info h3 {
            margin-bottom: 5px;
        }

        .download-info p {
            color: #8f99ad;

            font-size: 13px;
        }

        .download-info strong {
            color: #8ea2ff;
        }

        /* =========================
           BACK
        ========================= */

        .back-button {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            border: none;

            background: none;

            color: #aeb7c9;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .back-button:hover {
            color: white;
        }

        /* =========================
           CHANGELOG
        ========================= */

        .timeline {
            max-width: 800px;

            margin: auto;
        }

        .release {
            padding:
                25px
                0;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }

        .release:last-child {
            border-bottom: none;
        }

        .release-head {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 12px;
        }

        .release-head h2 {
            font-size: 21px;
        }

        .release-date {
            color: #687286;

            font-size: 13px;
        }

        .release ul {
            padding-left: 20px;

            color: #969fb3;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding:
                35px
                20px;

            border-top:
                1px solid
                rgba(255,255,255,0.07);

            color: #707a8f;

            text-align: center;

            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .nav {
                gap: 8px;
            }

            .nav button {
                display: none;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .download-card {
                flex-direction: column;

                align-items: flex-start;
            }

            .page-title h1 {
                font-size: 38px;
            }

            .hero h1 {
                letter-spacing: -3px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <button
            class="logo"
            onclick="navigate('home')"
            style="border:none;background:none;color:white;"
        >

            <img
                src="icon.ico"
                alt="Code++"
            >

            <span>Code++</span>

        </button>


        <nav class="nav">

            <button onclick="navigate('home')">
                Trang chủ
            </button>

            <button onclick="navigate('download')">
                Tải xuống
            </button>

            <button onclick="navigate('features')">
                Tính năng
            </button>

            <button onclick="navigate('docs')">
                Tài liệu
            </button>

            <button onclick="navigate('changelog')">

            </button>

            <button
                class="download-nav"
                onclick="navigate('download')"
            >
                Tải Code++
            </button>

        </nav>

    </div>

</header>


<div id="app"></div>


<footer>

    <div>
        © 2026 Code++ · C++ Edition & Java Edition
    </div>

</footer>


<script>

    /*
    ==========================================
    CODE++ WEBSITE ROUTER
    ==========================================

    Chỉ có index.html.

    JavaScript sẽ thay toàn bộ nội dung
    trong #app.

    */


    const pages = {

        /* =========================
           HOME
        ========================= */

        home: `
            <section class="page hero">

                        <button

                            onclick="navigate('download')"

        /* =========================

        ========================= */

        download: `

            <section class="page">

                    <button

                    <div class="page-title">

                    </div>


                    <!-- C++ -->

                    <div class="edition">

                        <h2 class="edition-title">
                            C++ Edition
                        </h2>


                        <div class="download-card">

                            <div class="download-info">

                                    Code++ 1.1.3
                                </h3>

                                    Windows Installer ·

                            <a

                            <a

                    </div>


                    <!-- JAVA -->

                    <div class="edition">

                        <h2 class="edition-title">
                            Java Edition
                        </h2>


                        <div class="download-card">

                            <div class="download-info">

                                <h3>
                                    Code++ Java Edition 1.2.0
                                </h3>

                                <p>
                                    Installer ·
                                    Release <strong>v1.2.0</strong>
                                </p>

                            </div>


                            <a
                                class="btn btn-primary"
                                href="https://github.com/tuin5995-rgb/codePP/releases/tag/v1.2.0"
                                target="_blank"
                                rel="noopener"
                            >
                                GitHub Release
                            </a>

                        </div>

                    </div>

                </div>

            </section>

        `,


        /* =========================
           FEATURES
        ========================= */

        features: `

            <section class="page">

                <div class="page-inner">

                    <button
                        class="back-button"
                        onclick="goBack()"
                    >
                        ← Quay lại
                    </button>


                    <div class="page-title">

                        <h1>
                            Tính năng
                        </h1>

                        <p>
                            Những gì Code++ đang hướng tới.
                        </p>

                    </div>


                    <div class="grid">

                        <div class="card">

                            <div class="icon">
                                &lt;/&gt;
                            </div>

                            <h3>
                                C++ Edition
                            </h3>

                            <p>
                                Môi trường tập trung
                                vào việc viết và chỉnh sửa

                            </p>

                        </div>


                        <div class="card">

                            <div class="icon">

                            </div>

                            <h3>
                                Nhẹ
                            </h3>

                            <p>
                                Bộ cài được thiết kế

                            </p>

                        </div>


                        <div class="card">

                            </div>

                            <h3>

                            </h3>

                            <p>
                                Phiên bản Java được
                                phát triển song song

                            </p>

                        </div>


                        <div class="card">

                            <div class="icon">
                                ↓
                            </div>

                            <h3>
                                Installer
                            </h3>

                            <p>
                                Hỗ trợ cài đặt ứng dụng

                            </p>

                        </div>


                        <div class="card">

                                ↻
                            </div>

                            <h3>
                                Cập nhật
                            </h3>

                                Các phiên bản được đánh

                            </p>

                        <div class="card">

                                phát hành thông qua GitHub.
                            </p>

                        </div>

                    </div>

                </div>

            </section>

        `,


        /* =========================
           DOCS
        ========================= */

        docs: `

            <section class="page">

                <div class="page-inner">

                    <button
                        class="back-button"
                        onclick="goBack()"
                    >
                        ← Quay lại
                    </button>


                    <div class="page-title">

                    </div>


                    <div class="grid">

                        <div class="card">

                            </div>

                            <h3>

                        <div class="card">

                            </div>

                            <h3>
                                Java Edition
                            </h3>

                            </p>

                        </div>


                        <div class="card">

                            <div class="icon">
                                ?
                            </div>

            </section>

        `,


        /* =========================
           CHANGELOG
        ========================= */

        changelog: `

            <section class="page">

                <div class="page-inner">

                    <button
                        class="back-button"
                        onclick="goBack()"
                    >
                        ← Quay lại
                    </button>


                    <div class="page-title">

                        <h1>
                            Changelog
                        </h1>

                        <p>
                            Các mốc phát triển của Code++.

                    <div class="timeline">


                        <div class="release">

                            <div class="release-head">

                                <h2>
                                    Code++ Java Edition 1.2.0
                                </h2>

                                </li>

                            </ul>

                        <div class="release">

                                    Code++ C++ Edition 1.1.3
                                </h2>

                                <span class="release-date">
                                    1.1.3
                                </span>

                                </li>

                                </li>

                        <div class="release">

                            <div class="release-head">

                                <h2>
                                    Code++ C++ Edition 1.1.2
                                </h2>

                                <span class="release-date">
                                    1.1.2
                                </span>

                            <ul>

                                <li>
                                    Phát hành dưới dạng ZIP.
                                </li>

            </section>

        `

    };


    /* =========================
       ROUTER
    ========================= */

    let currentPage = "home";


    function render(page, push = true) {

        if (!pages[page]) {
            page = "home";
        }


        currentPage = page;


        document
            .getElementById("app")
            .innerHTML = pages[page];


        window.scrollTo({
            top: 0,
            behavior: "instant"
        });


        if (push) {

            history.pushState(
                {
                    page: page
                },
                "",
                "#" + page
            );

        }


        updateTitle(page);

    }


    function navigate(page) {

        render(
            page,
            true
        );

    }


    function goBack() {

        if (
            window.history.length > 1 &&
            currentPage !== "home"
        ) {

            history.back();

        } else {

            navigate("home");

        }

    }


    function updateTitle(page) {

        const titles = {

            home:
                "Code++",

            download:
                "Tải xuống | Code++",

            features:
                "Tính năng | Code++",

            docs:
                "Tài liệu | Code++",

            changelog:
                "Changelog | Code++"

        };


        document.title =
            titles[page] ||
            "Code++";

    }


    /* =========================
       BROWSER BACK/FORWARD
    ========================= */

    window.addEventListener(
        "popstate",
        function (event) {

            const page =
                event.state &&
                event.state.page
                    ? event.state.page
                    : (
                        location.hash
                            ? location.hash.substring(1)
                            : "home"
                    );


            render(
                page,
                false
            );

        }
    );


    /* =========================
       INITIAL PAGE
    ========================= */

    let initialPage =
        location.hash
            ? location.hash.substring(1)
            : "home";


    if (!pages[initialPage]) {
        initialPage = "home";
    }


    render(
        initialPage,
        false
    );

</script>

</body>
</html>
