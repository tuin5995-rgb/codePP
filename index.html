<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code++</title>

    <meta
        name="description"
        content="Code++ - nền tảng lập trình với C++ Edition và Java Edition."
    >

    <link rel="icon" href="icon.ico" type="image/x-icon">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070a10;
            --bg2: #0c111b;
            --card: rgba(18, 24, 38, .74);
            --border: rgba(255, 255, 255, .09);
            --text: #f5f7ff;
            --muted: #8f99ad;
            --blue: #7187ff;
            --blue-light: #a4b1ff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(87, 105, 255, .14),
                    transparent 45%
                ),
                var(--bg);

            color: var(--text);

            min-height: 100vh;

            overflow-x: hidden;
        }

        button,
        a {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            z-index: -10;

            overflow: hidden;

            pointer-events: none;
        }

        .orb {
            position: absolute;

            width: 480px;
            height: 480px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: .15;

            animation:
                floating 13s ease-in-out infinite;
        }

        .orb.one {
            background: #526cff;

            left: -180px;
            top: -220px;
        }

        .orb.two {
            background: #874dff;

            right: -230px;
            top: 35%;

            animation-delay: -4s;
        }

        .orb.three {
            background: #326eff;

            left: 35%;
            bottom: -320px;

            animation-delay: -8s;
        }

        @keyframes floating {
            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(45px, -35px, 0)
                    scale(1.1);
            }
        }

        /* =========================================
           HEADER
        ========================================= */

        header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 72px;

            z-index: 1000;

            background:
                rgba(7, 10, 16, .76);

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                rgba(255, 255, 255, .07);
        }

        .header-inner {
            width:
                min(
                    1160px,
                    calc(100% - 36px)
                );

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            border: 0;

            background: transparent;

            color: white;

            font-size: 21px;

            font-weight: 800;
        }

        .logo img {
            width: 39px;
            height: 39px;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 0 25px
                rgba(113, 135, 255, .22);
        }

        .nav {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .nav button {
            border: 0;

            background: transparent;

            color: #a9b2c5;

            padding:
                9px
                12px;

            border-radius: 9px;

            transition:
                background .2s,
                color .2s,
                transform .2s;
        }

        .nav button:hover {
            color: white;

            background:
                rgba(255, 255, 255, .06);
        }

        .nav-download {
            background: white !important;

            color: #101522 !important;

            font-weight: 700;

            margin-left: 7px;
        }

        .nav-download:hover {
            background: #edf0ff !important;

            transform:
                translateY(-1px);
        }

        /* =========================================
           APP
        ========================================= */

        #app {
            min-height: 100vh;

            padding-top: 72px;
        }

        .page {
            min-height:
                calc(100vh - 72px);

            padding:
                90px 20px;

            animation:
                pageEnter .42s ease;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;

                transform:
                    translateY(18px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .page-inner {
            width:
                min(
                    1120px,
                    100%
                );

            margin: auto;
        }

        /* =========================================
           HERO
        ========================================= */

        .hero {
            min-height:
                calc(100vh - 72px);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            position: relative;
        }

        .hero-content {
            max-width: 900px;
        }

        .badge {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                8px
                14px;

            background:
                rgba(255, 255, 255, .045);

            border:
                1px solid
                rgba(255, 255, 255, .1);

            border-radius: 999px;

            color: #aeb7ca;

            font-size: 13px;

            animation:
                fadeUp .7s ease;
        }

        .badge::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:
                0 0 13px
                var(--blue);
        }

        .hero h1 {
            margin-top: 28px;

            font-size:
                clamp(
                    70px,
                    12vw,
                    125px
                );

            line-height: .86;

            letter-spacing: -8px;

            animation:
                fadeUp .8s ease;
        }

        .hero h1 span {
            color: var(--blue-light);

            text-shadow:
                0 0 45px
                rgba(113, 135, 255, .32);
        }

        .hero p {
            max-width: 680px;

            margin:
                30px
                auto
                0;

            color: #9da7ba;

            font-size: 18px;

            line-height: 1.7;

            animation:
                fadeUp .9s ease;
        }

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 34px;

            animation:
                fadeUp 1s ease;
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 49px;

            padding:
                0
                22px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255, 255, 255, .1);

            font-weight: 700;

            transition:
                transform .2s,
                box-shadow .2s,
                background .2s;
        }

        .btn:hover {
            transform:
                translateY(-3px);

            box-shadow:
                0 14px 35px
                rgba(0, 0, 0, .25);
        }

        .btn-primary {
            background: white;

            color: #101522;
        }

        .btn-primary:hover {
            background: #edf0ff;
        }

        .btn-secondary {
            background:
                rgba(255, 255, 255, .055);

            color: white;
        }

        .version {
            margin-top: 17px;

            color: #677185;

            font-size: 13px;

            animation:
                fadeUp 1.1s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* =========================================
           PAGE TITLE
        ========================================= */

        .page-title {
            text-align: center;

            margin-bottom: 55px;
        }

        .page-title h1 {
            font-size:
                clamp(
                    38px,
                    6vw,
                    55px
                );

            letter-spacing: -2px;

            margin-bottom: 12px;
        }

        .page-title p {
            color: var(--muted);

            line-height: 1.6;
        }

        /* =========================================
           BACK BUTTON
        ========================================= */

        .back {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            border: 0;

            background: transparent;

            color: #98a2b6;

            font-size: 14px;

            margin-bottom: 32px;

            transition:
                color .2s,
                transform .2s;
        }

        .back:hover {
            color: white;

            transform:
                translateX(-4px);
        }

        /* =========================================
           CARDS
        ========================================= */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 18px;
        }

        .card {
            padding: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 24, 38, .82),
                    rgba(13, 18, 29, .64)
                );

            border:
                1px solid
                var(--border);

            border-radius: 17px;

            backdrop-filter:
                blur(12px);

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;
        }

        .card:hover {
            transform:
                translateY(-6px);

            border-color:
                rgba(135, 150, 255, .28);

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, .22);
        }

        .card-icon {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 19px;

            background:
                rgba(113, 135, 255, .12);

            border:
                1px solid
                rgba(113, 135, 255, .15);

            border-radius: 12px;

            color: #a9b6ff;

            font-weight: 700;
        }

        .card h3 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .card p {
            color: #8e98ad;

            font-size: 14px;

            line-height: 1.65;
        }

        /* =========================================
           DOWNLOAD
        ========================================= */

        .edition {
            margin-bottom: 48px;
        }

        .edition-title {
            font-size: 28px;

            margin-bottom: 18px;
        }

        .download-card {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 24px;

            margin-bottom: 12px;

            background:
                rgba(17, 23, 37, .72);

            border:
                1px solid
                var(--border);

            border-radius: 15px;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;
        }

        .download-card:hover {
            transform:
                translateX(4px);

            border-color:
                rgba(135, 150, 255, .28);

            box-shadow:
                0 14px 35px
                rgba(0, 0, 0, .18);
        }

        .download-info h3 {
            margin-bottom: 6px;

            font-size: 18px;
        }

        .download-info p {
            color: #8993a8;

            font-size: 13px;

            line-height: 1.5;
        }

        .latest {
            display: inline-block;

            margin-left: 7px;

            padding:
                3px
                7px;

            border-radius: 5px;

            background:
                rgba(113, 135, 255, .12);

            color: #9aa9ff;

            font-size: 10px;

            vertical-align: middle;
        }

        /* =========================================
           DOCS
        ========================================= */

        .docs-text {
            max-width: 800px;

            margin: auto;

            color: #a0a9bb;

            line-height: 1.9;

            text-align: center;
        }

        /* =========================================
           CHANGELOG
        ========================================= */

        .release-box {
            max-width: 820px;

            margin: auto;

            padding: 30px;

            background:
                rgba(17, 23, 37, .72);

            border:
                1px solid
                var(--border);

            border-radius: 17px;
        }

        .release {
            padding:
                24px
                0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, .07);
        }

        .release:first-child {
            padding-top: 0;
        }

        .release:last-child {
            border-bottom: 0;

            padding-bottom: 0;
        }

        .release-head {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 12px;
        }

        .release-head h2 {
            font-size: 20px;
        }

        .release-tag {
            color: #8d9aff;

            font-size: 12px;
        }

        .release ul {
            padding-left: 20px;

            color: #919bb0;

            line-height: 1.8;
        }

        /* =========================================
           FOOTER
        ========================================= */

        footer {
            padding:
                35px
                20px;

            border-top:
                1px solid
                rgba(255, 255, 255, .07);

            color: #697388;

            text-align: center;

            font-size: 13px;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            .nav button:not(.nav-download) {
                display: none;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .download-card {
                flex-direction: column;

                align-items: flex-start;
            }

            .hero h1 {
                letter-spacing: -4px;
            }

            .page {
                padding:
                    65px
                    18px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
    </div>


    <header>

        <div class="header-inner">

            <button
                class="logo"
                onclick="navigate('home')"
                aria-label="Trang chủ Code++"
            >

                <img
                    src="icon.ico"
                    alt="Code++"
                >

                <span>Code++</span>

            </button>


            <nav class="nav">

                <button
                    onclick="navigate('home')"
                >
                    Trang chủ
                </button>

                <button
                    onclick="navigate('download')"

                    Tải xuống
                </button>

                <button
                    onclick="navigate('features')"
                >
                    Tính năng
                </button>

                <button
                    onclick="navigate('docs')"
                >
                    Tài liệu
                </button>

                <button
                    onclick="navigate('changelog')"
                >
                    Cập nhật
                </button>

                <button
                    class="nav-download"
                    onclick="navigate('download')"
                >
                    Tải Code++
                </button>

            </nav>

        </div>

    </header>


    <main id="app"></main>


    <footer>
        © 2026 Code++ · C++ Edition · Java Edition
    </footer>


    <script>

        /* =========================================
           DOWNLOAD LINKS
        ========================================= */

        const DOWNLOADS = {

            cpp112:

            cpp113:
                "CodePlusPlus-1.1.3-Setup.exe",

            java120:

        /* =========================================
           PAGES
        ========================================= */

        const pages = {

            `,


            download: `

                    <div class="page-inner">

                            class="back"
                            onclick="goBack()"

                            ← Quay lại

                                C++ Edition

                                <div class="download-info">

            `,


            features: `

            `,


            docs: `

                        <button

                        >

            `,


            changelog: `

                            onclick="goBack()"
                        >
                            ← Quay lại
                        </button>


                        <div class="page-title">

                            <h1>
                                Changelog
                            </h1>

                            <p>
                                Các mốc phát triển của Code++.
                            </p>

                        </div>


                        <div class="release-box">


                            <div class="release">

                                <div class="release-head">

                                    <h2>
                                        Java Edition 1.2.0
                                    </h2>

                                    <span class="release-tag">
                                        v1.2.0
                                    </span>

                                </div>

                                <ul>

                                    <li>
                                        Phát hành Java Edition.
                                    </li>

                                    <li>
                                        Có Windows Installer.
                                    </li>

                                    <li>
                                        Phát hành qua GitHub Releases.
                                    </li>

                                </ul>

                            </div>


                            <div class="release">

                                <div class="release-head">

                                    <h2>
                                        C++ Edition 1.1.3
                                    </h2>

                                    <span class="release-tag">
                                        1.1.3
                                    </span>

                                </div>

                                <ul>

                                    <li>
                                        Chuyển sang Windows Installer.
                                    </li>

                                    <li>
                                        Hỗ trợ shortcut.
                                    </li>

                                    <li>
                                        Hỗ trợ uninstall.
                                    </li>

                                </ul>

                            </div>


                            <div class="release">

                                <div class="release-head">

                                    <h2>
                                        C++ Edition 1.1.2
                                    </h2>

                                    <span class="release-tag">
                                        1.1.2
                                    </span>

                                </div>

                                    </li>

                                </ul>

                            </div>


                        </div>

                    </div>

                </section>

            `

        };


        /* =========================================
           ROUTER
        ========================================= */

        let currentPage = "home";


        function render(page, push = true) {

            if (!pages[page]) {
                page = "home";
            }


            currentPage = page;


            document.getElementById("app").innerHTML =
                pages[page];


            if (push) {

                history.pushState(
                    {
                        page: page
                    },
                    "",
                    "#" + page
                );

            }


            updateTitle(page);


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        function navigate(page) {

            render(
                page,
                true
            );

        }


        function goBack() {

            if (
                currentPage !== "home" &&
                history.length > 1
            ) {

                history.back();

            } else {

                navigate("home");

            }

        }


        function updateTitle(page) {

            const titles = {

                home:
                    "Code++",

                download:
                    "Tải xuống | Code++",

                features:
                    "Tính năng | Code++",

                docs:
                    "Tài liệu | Code++",

                changelog:
                    "Changelog | Code++"

            };


            document.title =
                titles[page] ||
                "Code++";

        }


        /* =========================================
           BROWSER BACK / FORWARD
        ========================================= */

        window.addEventListener(
            "popstate",
            function(event) {

                let page =
                    event.state &&
                    event.state.page
                        ? event.state.page
                        : (
                            location.hash
                                ? location.hash.substring(1)
                                : "home"
                        );


                if (!pages[page]) {
                    page = "home";
                }


                render(
                    page,
                    false
                );

            }
        );


        /* =========================================
           INITIAL LOAD
        ========================================= */

        let initialPage =
            location.hash
                ? location.hash.substring(1)
                : "home";


        if (!pages[initialPage]) {
            initialPage = "home";
        }


        render(
            initialPage,
            false
        );

    </script>
